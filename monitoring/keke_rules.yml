# Alerting rules for metrics the app actually exposes.
#
# The previous file alerted on node_cpu_seconds_total, node_memory_*,
# kube_pod_container_status_restarts_total, freertos_task_queue_size,
# redis_connected_clients, mongodb_connections_current,
# postgresql_stat_activity_count, keke_file_uploads_total,
# keke_file_processing_duration_seconds, keke_cloud_service_status and
# ssl_cert_not_after. None of those series are produced by any deployed
# component, so every rule could never fire.
#
# Only metrics served from /metrics are referenced here. Rules that need
# exporters (node_exporter, kube-state-metrics, redis_exporter,
# postgres_exporter, mongodb_exporter, blackbox_exporter) live in
# keke_rules.exporters.yml, which is not loaded by default.
groups:
  - name: keke.app
    rules:
      - alert: KekeAppDown
        expr: up{job="keke-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Keke application is down"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than 1 minute"

      - alert: KekeHighErrorRate
        expr: |
          sum(rate(keke_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(keke_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate"
          description: "More than 5% of requests have failed with 5xx for 5 minutes"

      - alert: KekeSlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(keke_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "95th percentile request duration is above 2 seconds"

      - alert: KekeProcessMemoryHigh
        expr: keke_process_resident_memory_bytes > 536870912
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Keke process memory is high"
          description: "The Node process is holding more than 512MB resident for 10 minutes"

  - name: keke.python
    rules:
      # A timeout means a Python helper hit PYTHON_TIMEOUT_MS and was killed.
      - alert: KekePythonTimeouts
        expr: sum(increase(keke_python_calls_total{outcome="timeout"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Python helper timed out"
          description: "A Python helper exceeded PYTHON_TIMEOUT_MS and was SIGKILLed; check PYTHON_TIMEOUT_MS and the workload"

      - alert: KekePythonErrorRate
        expr: |
          sum(rate(keke_python_calls_total{outcome="error"}[5m]))
            / clamp_min(sum(rate(keke_python_calls_total[5m])), 0.001) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High Python helper failure rate"
          description: "More than 10% of Python helper invocations are failing"
