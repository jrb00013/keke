# Prometheus scrape configuration.
#
# Every target below is scrapeable as configured. The previous version pointed
# at /node-metrics and /freertos-metrics (endpoints the server never
# implemented), scraped redis/mongodb/postgres on their raw protocol ports
# (those need the corresponding *_exporter sidecars) and scraped
# /nginx_status (not defined in nginx.conf), so every job was permanently
# down.
#
# Kubernetes service discovery is intentionally absent: the manifests ship no
# ServiceAccount or RBAC, so the default service account cannot list pods,
# nodes or endpoints. To monitor the cluster, grant the Prometheus service
# account list/watch on those resources and re-add the kubernetes_sd_configs
# jobs (see k8s/monitoring.yaml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "keke_rules.yml"

# No Alertmanager is deployed, so alerts are only visible in the Prometheus UI.
# Add an Alertmanager service and re-enable this block to route them:
#
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

scrape_configs:
  # The application. Serves Prometheus text format on /metrics.
  - job_name: 'keke-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['keke-app:3000']
    scrape_interval: 10s
    scrape_timeout: 5s
