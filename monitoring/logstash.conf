# Logstash pipeline for Keke.
#
# Reads the application's JSON log file over a mounted volume and ships it to
# Elasticsearch. Referenced by docker-compose.yml; the file previously did not
# exist, so the bind mount created a directory and Logstash failed to start.

input {
    file {
        path => "/var/log/keke/*.log"
        codec => json
        start_position => "beginning"
        sincedb_path => "/usr/share/logstash/data/plugins/inputs/file/.sincedb"
        tags => ["keke"]
    }
}

filter {
    if ![timestamp] {
        mutate { add_field => { "timestamp" => "%{@timestamp}" } }
    }
    mutate {
        add_field => { "[@metadata][index]" => "keke-logs" }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "keke-logs-%{+YYYY.MM.dd}"
    }

    # Echo to the container log for local debugging.
    stdout { codec => rubydebug { metadata => false } }
}
