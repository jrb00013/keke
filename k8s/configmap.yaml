apiVersion: v1
kind: ConfigMap
metadata:
  name: keke-config
  namespace: keke
  labels:
    app: keke-excel-tool
# Only variables the application actually reads are listed here.
#
# The previous version also set DEBUG, OPENAI_MODEL, OPENAI_MAX_TOKENS,
# OPENAI_TEMPERATURE, SUPPORTED_FORMATS, CLEANUP_INTERVAL, WORKER_PROCESSES,
# MAX_MEMORY_USAGE, CACHE_TTL, CACHE_MAX_SIZE, RATE_LIMIT, RATE_WINDOW,
# MONITORING_ENABLED, LOG_LEVEL, LOG_FORMAT and seven FEATURE_* flags. None of
# them are read by api/server.js, api/api_routes.js or the Python helpers, so
# they were silently inert while implying behaviour that does not exist. It
# also set DATABASE_URL, but the application reads POSTGRES_URL.
data:
  # Node server (api/server.js)
  KEKE_ENV: "production"
  PORT: "3000"
  AI_ENABLED: "false"

  # Uploads and session storage (api/api_routes.js)
  MAX_FILE_SIZE: "52428800"
  KEKE_SESSION_DIR: "/app/data/sessions"

  # Python subprocess handling (api/python_runner.js). PR-hardened default is
  # 120000 ms; raise it only if a large workbook legitimately needs longer.
  PYTHON_TIMEOUT_MS: "120000"

  # Comma-separated CORS allowlist. Empty means same-origin only.
  ALLOWED_ORIGINS: ""

  # FreeRTOS bridge socket (api/rtos_bridge.py)
  KEKE_RTOS_SOCKET: ""

  # Datastore URLs. These are reported by run.py at startup; the datastores
  # themselves are not yet wired into request handling, which is why the
  # compose and Kubernetes database services are opt-in.
  POSTGRES_URL: "postgresql://postgres:password@postgres-service:5432/keke"
  REDIS_URL: "redis://redis-service:6379"
  MONGODB_URL: "mongodb://mongodb-service:27017/keke"
