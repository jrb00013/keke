# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: keke
  labels:
    app: keke-excel-tool
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keke-excel-tool
      component: prometheus
  template:
    metadata:
      labels:
        app: keke-excel-tool
        component: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
          name: prometheus
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--web.enable-lifecycle'
        - '--storage.tsdb.retention.time=15d'
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-data-pvc

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: keke
  labels:
    app: keke-excel-tool
    component: prometheus
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: prometheus
  selector:
    app: keke-excel-tool
    component: prometheus

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: keke
  labels:
    app: keke-excel-tool
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keke-excel-tool
      component: grafana
  template:
    metadata:
      labels:
        app: keke-excel-tool
        component: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: grafana
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-config
          mountPath: /etc/grafana/provisioning/datasources
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data-pvc
      - name: grafana-config
        configMap:
          name: grafana-config

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: keke
  labels:
    app: keke-excel-tool
    component: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: grafana
  selector:
    app: keke-excel-tool
    component: grafana

---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: keke
  labels:
    app: keke-excel-tool
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "keke_rules.yml"
    
    scrape_configs:
      - job_name: 'keke-app'
        static_configs:
          - targets: ['keke-service:3000']
        metrics_path: '/metrics'
        scrape_interval: 30s
      
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

  keke_rules.yml: |
    groups:
    - name: keke.rules
      rules:
      # High CPU usage alert
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}"

      # High memory usage alert
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}"

      # Disk space alert
      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10% on {{ $labels.instance }}"

      # Keke application down
      - alert: KekeAppDown
        expr: up{job="keke-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Keke application is down"
          description: "Keke application has been down for more than 1 minute"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "95th percentile response time is above 2 seconds"

      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate"
          description: "Error rate is above 5% for more than 5 minutes"

      # FreeRTOS task queue full
      - alert: FreeRTOSTaskQueueFull
        expr: freertos_task_queue_size / freertos_task_queue_capacity > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "FreeRTOS task queue nearly full"
          description: "FreeRTOS task queue is more than 90% full"

      # Redis connection issues
      - alert: RedisConnectionIssues
        expr: redis_connected_clients == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis connection issues"
          description: "No Redis clients connected"

      # MongoDB connection issues
      - alert: MongoDBConnectionIssues
        expr: mongodb_connections_current == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB connection issues"
          description: "No MongoDB connections active"

      # PostgreSQL connection issues
      - alert: PostgreSQLConnectionIssues
        expr: postgresql_stat_activity_count == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connection issues"
          description: "No PostgreSQL connections active"

      # High file upload rate
      - alert: HighFileUploadRate
        expr: rate(keke_file_uploads_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High file upload rate"
          description: "File upload rate is above 10 files per minute"

      # Large file processing time
      - alert: LongFileProcessingTime
        expr: histogram_quantile(0.95, rate(keke_file_processing_duration_seconds_bucket[5m])) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Long file processing time"
          description: "95th percentile file processing time is above 5 minutes"

      # Cloud service failures
      - alert: CloudServiceFailure
        expr: keke_cloud_service_status == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Cloud service failure"
          description: "Cloud service {{ $labels.service }} is not responding"

      # Memory leak detection
      - alert: MemoryLeak
        expr: increase(node_memory_MemTotal_bytes[1h]) > 0 and increase(node_memory_MemAvailable_bytes[1h]) < 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Potential memory leak"
          description: "Memory usage is increasing without corresponding availability increase"

      # Pod restart alert
      - alert: PodRestart
        expr: increase(kube_pod_container_status_restarts_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Pod restarted"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted"

      # Certificate expiration
      - alert: CertificateExpiration
        expr: (ssl_cert_not_after - time()) / 86400 < 30
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value }} days"

---
# Grafana ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: keke
  labels:
    app: keke-excel-tool
    component: monitoring
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: true
