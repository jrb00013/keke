# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: keke
  labels:
    app: keke-excel-tool
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keke-excel-tool
      component: prometheus
  template:
    metadata:
      labels:
        app: keke-excel-tool
        component: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
          name: prometheus
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--web.enable-lifecycle'
        - '--storage.tsdb.retention.time=15d'
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-data-pvc

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: keke
  labels:
    app: keke-excel-tool
    component: prometheus
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: prometheus
  selector:
    app: keke-excel-tool
    component: prometheus

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: keke
  labels:
    app: keke-excel-tool
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keke-excel-tool
      component: grafana
  template:
    metadata:
      labels:
        app: keke-excel-tool
        component: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: grafana
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-config
          mountPath: /etc/grafana/provisioning/datasources
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data-pvc
      - name: grafana-config
        configMap:
          name: grafana-config

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: keke
  labels:
    app: keke-excel-tool
    component: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: grafana
  selector:
    app: keke-excel-tool
    component: grafana

---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: keke
  labels:
    app: keke-excel-tool
    component: monitoring
data:
  prometheus.yml: |
    # Prometheus scrape configuration.
    #
    # Every target below is scrapeable as configured. The previous version pointed
    # at /node-metrics and /freertos-metrics (endpoints the server never
    # implemented), scraped redis/mongodb/postgres on their raw protocol ports
    # (those need the corresponding *_exporter sidecars) and scraped
    # /nginx_status (not defined in nginx.conf), so every job was permanently
    # down.
    #
    # Kubernetes service discovery is intentionally absent: the manifests ship no
    # ServiceAccount or RBAC, so the default service account cannot list pods,
    # nodes or endpoints. To monitor the cluster, grant the Prometheus service
    # account list/watch on those resources and re-add the kubernetes_sd_configs
    # jobs (see k8s/monitoring.yaml).

    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "keke_rules.yml"

    # No Alertmanager is deployed, so alerts are only visible in the Prometheus UI.
    # Add an Alertmanager service and re-enable this block to route them:
    #
    # alerting:
    #   alertmanagers:
    #     - static_configs:
    #         - targets:
    #           - alertmanager:9093

    scrape_configs:
      # The application. Serves Prometheus text format on /metrics.
      - job_name: 'keke-app'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['keke-app:3000']
        scrape_interval: 10s
        scrape_timeout: 5s

  keke_rules.yml: |
    # Alerting rules for metrics the app actually exposes.
    #
    # The previous file alerted on node_cpu_seconds_total, node_memory_*,
    # kube_pod_container_status_restarts_total, freertos_task_queue_size,
    # redis_connected_clients, mongodb_connections_current,
    # postgresql_stat_activity_count, keke_file_uploads_total,
    # keke_file_processing_duration_seconds, keke_cloud_service_status and
    # ssl_cert_not_after. None of those series are produced by any deployed
    # component, so every rule could never fire.
    #
    # Only metrics served from /metrics are referenced here. Rules that need
    # exporters (node_exporter, kube-state-metrics, redis_exporter,
    # postgres_exporter, mongodb_exporter, blackbox_exporter) live in
    # keke_rules.exporters.yml, which is not loaded by default.
    groups:
      - name: keke.app
        rules:
          - alert: KekeAppDown
            expr: up{job="keke-app"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Keke application is down"
              description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than 1 minute"

          - alert: KekeHighErrorRate
            expr: |
              sum(rate(keke_http_requests_total{status=~"5.."}[5m]))
                / clamp_min(sum(rate(keke_http_requests_total[5m])), 0.001) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate"
              description: "More than 5% of requests have failed with 5xx for 5 minutes"

          - alert: KekeSlowResponses
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(keke_http_request_duration_seconds_bucket[5m]))
              ) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High response time"
              description: "95th percentile request duration is above 2 seconds"

          - alert: KekeProcessMemoryHigh
            expr: keke_process_resident_memory_bytes > 536870912
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Keke process memory is high"
              description: "The Node process is holding more than 512MB resident for 10 minutes"

      - name: keke.python
        rules:
          # A timeout means a Python helper hit PYTHON_TIMEOUT_MS and was killed.
          - alert: KekePythonTimeouts
            expr: sum(increase(keke_python_calls_total{outcome="timeout"}[10m])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Python helper timed out"
              description: "A Python helper exceeded PYTHON_TIMEOUT_MS and was SIGKILLed; check PYTHON_TIMEOUT_MS and the workload"

          - alert: KekePythonErrorRate
            expr: |
              sum(rate(keke_python_calls_total{outcome="error"}[5m]))
                / clamp_min(sum(rate(keke_python_calls_total[5m])), 0.001) > 0.1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High Python helper failure rate"
              description: "More than 10% of Python helper invocations are failing"

---
# Grafana ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: keke
  labels:
    app: keke-excel-tool
    component: monitoring
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: true
