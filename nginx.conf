# Minimal HTTP reverse proxy for the Keke app.
#
# TLS terminates at the ingress/load balancer in front of this container, so
# this config only listens on :80. It exists because docker-compose previously
# mounted a non-existent ./nginx.conf, which Docker materialised as a directory
# and nginx then failed to start.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Excel uploads can be large; keep in step with the app's MAX_FILE_SIZE.
    client_max_body_size 50m;

    # Docker's embedded DNS. Resolving at request time (via the variable below)
    # means nginx starts even if keke-app is not up yet, instead of failing at
    # startup with "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        location / {
            set $keke_app http://keke-app:3000;
            proxy_pass         $keke_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
